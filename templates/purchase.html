{% extends "base.html" %}
{% block title %}발주 입력 - 구매관리{% endblock %}
{% block extra_head %}
<style>
.po-page { color:#1e293b; }
.po-page h1 { font-size:20px; margin:0 0 12px; }
.po-box { background:#fff; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:14px; }
.po-header { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; padding:16px 18px; }
.po-field { display:grid; grid-template-columns:100px minmax(0,1fr); align-items:start; gap:8px; font-size:13px; }
.po-field label { padding-top:8px; font-weight:600; white-space:nowrap; }
.po-field input,.po-field textarea { box-sizing:border-box; width:100%; padding:7px 9px; border:1px solid #cbd5e1; border-radius:4px; font:inherit; background:#fff; }
.po-field input[readonly] { background:#f8fafc; }
.po-field-wide { grid-column:1/-1; }
.po-field-wide textarea { resize:vertical; }
.po-lookup { min-width:0; }
.po-lookup-hint { color:#64748b; font-size:11px; min-height:15px; padding-top:2px; }
.po-suggestions { margin-top:3px; border:1px solid #cbd5e1; border-radius:4px; background:#fff; max-height:165px; overflow-y:auto; }
.po-suggestions:empty { display:none; }
.po-suggestions button { display:block; width:100%; border:0; border-bottom:1px solid #e2e8f0; padding:6px 8px; background:#fff; text-align:left; cursor:pointer; font:inherit; }
.po-suggestions button:hover,.po-suggestions button:focus { background:#eff6ff; }
.po-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:9px 0; }
.po-btn { border:1px solid #cbd5e1; background:#fff; border-radius:4px; padding:6px 12px; font-size:12px; cursor:pointer; }
.po-btn:hover { background:#f1f5f9; }
.po-btn-primary { background:#2563eb; border-color:#2563eb; color:#fff; font-weight:700; }
.po-btn-primary:hover { background:#1d4ed8; }
.po-btn:disabled { opacity:.55; cursor:default; }
.po-grid-wrap { overflow-x:auto; }
.po-grid { border-collapse:collapse; width:100%; min-width:1280px; font-size:12px; }
.po-grid th,.po-grid td { border:1px solid #dbe2eb; padding:4px; vertical-align:top; }
.po-grid th { background:#f8fafc; text-align:center; font-weight:600; white-space:nowrap; height:30px; }
.po-grid tbody tr:nth-child(even) { background:#fbfcfe; }
.po-grid input,.po-grid select { box-sizing:border-box; width:100%; min-width:0; border:1px solid transparent; background:transparent; padding:5px; font:inherit; border-radius:3px; }
.po-grid input:focus,.po-grid select:focus { border-color:#2563eb; background:#fff; outline:none; }
.po-grid input[readonly] { color:#475569; }
.po-grid input[type=number] { text-align:right; }
.po-grid input[type=date] { min-width:126px; }
.po-grid td.po-seq { text-align:center; color:#64748b; padding-top:10px; width:32px; }
.po-grid .po-suggestions { min-width:210px; font-size:12px; }
.po-grid .po-row-status { color:#b45309; font-size:11px; }
.po-grid .po-remove { border:0; background:transparent; color:#64748b; cursor:pointer; padding:5px; }
.po-footer { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 0; }
.po-message { font-size:13px; min-height:18px; }
@media(max-width:750px) { .po-header { grid-template-columns:1fr; } .po-field-wide { grid-column:1; } }
</style>
{% endblock %}
{% block content %}
<div class="container po-page">
  <h1>발주서 입력</h1>
  <form id="po-form" class="po-box">
    <div class="po-header">
      <div class="po-field"><label for="po-date">발주일자</label><input id="po-date" type="date" required></div>
      <div class="po-field"><label for="po-vendor-query">거래처</label><div class="po-lookup"><input id="po-vendor-query" autocomplete="off" placeholder="거래처 코드 또는 이름 입력" required><div id="po-vendor-results" class="po-suggestions"></div><div id="po-vendor-hint" class="po-lookup-hint">등록된 공급사 거래처에서 조회합니다.</div></div></div>
      <div class="po-field"><label for="po-manager">담당자</label><input id="po-manager" maxlength="50"></div>
      <div class="po-field"><label for="po-requested-date">납기요청일</label><input id="po-requested-date" type="date"></div>
      <div class="po-field"><label for="po-number">발주번호</label><input id="po-number" value="저장 시 자동 발번" readonly></div>
      <div class="po-field"><label for="po-state">상태</label><input id="po-state" value="발주완료" readonly></div>
      <div class="po-field po-field-wide"><label for="po-note">비고</label><textarea id="po-note" rows="2" maxlength="1000"></textarea></div>
    </div>
    <div class="po-toolbar">
      <button class="po-btn" type="button" id="po-add-row">+ 행 추가</button>
      <span class="po-lookup-hint">기존 발주 수정은 발주 조회에서 순번 선택 후 선택수정을 누릅니다.</span>
    </div>
    <div class="po-grid-wrap"><table class="po-grid">
      <colgroup><col style="width:36px"><col style="width:160px"><col style="width:170px"><col style="width:120px"><col style="width:60px"><col style="width:90px"><col style="width:120px"><col style="width:120px"><col style="width:135px"><col style="width:160px"><col style="width:42px"></colgroup>
      <thead><tr><th>No.</th><th>품번 / 품명 검색</th><th>품명</th><th>규격</th><th>단위</th><th>발주수량</th><th>입고창고</th><th>저장위치</th><th>납기일</th><th>비고</th><th></th></tr></thead>
      <tbody id="po-lines"></tbody>
    </table></div>
    <select id="po-warehouse-template" hidden><option value="">선택</option>{% for warehouse in warehouse_masters %}<option value="{{ warehouse.warehouse_code }}">{{ warehouse.warehouse_code }} · {{ warehouse.warehouse_name }}</option>{% endfor %}</select>
    <select id="po-location-template" hidden><option value="">선택</option>{% for location in storage_locations %}<option value="{{ location.location_code }}">{{ location.location_code }} · {{ location.location_name }}</option>{% endfor %}</select>
    <div class="po-footer"><button class="po-btn" type="button" id="po-new">신규</button><button class="po-btn po-btn-primary" type="submit" id="po-save">저장</button><span id="po-message" class="po-message" role="status"></span></div>
  </form>
</div>
{% endblock %}
{% block extra_script %}<script src="{{ url_for('static', path='purchase_orders.js') }}?v=20260914-2" defer></script>{% endblock %}

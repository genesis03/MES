<style>
.inspection-standard-heading{margin-bottom:16px}.inspection-standard-heading h1{font-size:24px;margin:0 0 8px}.inspection-standard-heading p{color:#64748b;font-size:13px;margin-bottom:12px}.inspection-standard-tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #cbd5e1;padding-bottom:10px}.inspection-standard-tabs a{display:block;text-decoration:none;padding:9px 14px;border-radius:5px;color:#334155;background:#e2e8f0;font-size:13px;font-weight:700}.inspection-standard-tabs a.active{background:#2563eb;color:#fff}
</style>
<div class="inspection-standard-heading">
  <h1>검사기준서 관리</h1>
  <p>표준문서 관리 · 검사항목 마스터와 품목별 입고검사 기준서</p>
  <nav class="inspection-standard-tabs" aria-label="검사기준서 탭">
    {% if can_read_inbound_standards %}<a href="/quality/inbound-standards" class="{{ 'active' if request.url.path == '/quality/inbound-standards' else '' }}"{% if request.url.path == '/quality/inbound-standards' %} aria-current="page"{% endif %}>입고검사 기준서</a>{% endif %}
    {% if can_read_inspection_master %}<a href="/quality/inspection-items" class="{{ 'active' if request.url.path == '/quality/inspection-items' else '' }}"{% if request.url.path == '/quality/inspection-items' %} aria-current="page"{% endif %}>검사항목 마스터</a>{% endif %}
  </nav>
</div>

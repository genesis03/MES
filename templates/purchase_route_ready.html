{% extends "base.html" %}

{% block title %}{{ page_title }} - 구매관리{% endblock %}

{% block content %}
<div style="max-width:900px; margin:0 auto;">
    <div style="background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:24px;">
        <h1 style="font-size:22px; margin-bottom:10px;">{{ page_title }}</h1>
        <p style="color:#475569; margin-bottom:14px;">{{ page_description }}</p>
        <div style="font-size:13px; color:#64748b;">
            표준 경로: <strong>{{ route_path }}</strong>
        </div>
        <div style="margin-top:18px; padding:12px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; color:#475569; font-size:13px;">
            이 화면은 라우팅 정리 단계의 준비 화면입니다. 실제 업무 기능은 기존 기준정보와 DB 구조를 연동해 순차 구현합니다.
        </div>
    </div>
</div>
{% endblock %}

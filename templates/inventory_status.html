{% extends "base.html" %}
{% block title %}재고 현황{% endblock %}
{% block extra_head %}
<style>
.inv-page{font-size:13px}.inv-page h1{font-size:22px;margin:0 0 6px}.inv-sub{color:#64748b;margin-bottom:14px}
.inv-panel{background:#fff;border:1px solid #cbd5e1;border-radius:7px;margin-bottom:14px}
.inv-panel-title{padding:10px 14px;border-bottom:1px solid #dbe3ec;font-weight:800}
.inv-filter{display:grid;grid-template-columns:90px minmax(320px,620px) 100px 100px 1fr;gap:8px;align-items:center;padding:12px 14px}
.inv-filter input{height:36px;border:1px solid #cbd5e1;border-radius:4px;padding:0 10px}
.inv-btn{height:36px;border:0;border-radius:4px;padding:0 15px;font-weight:800;cursor:pointer}
.inv-primary{background:#2563eb;color:#fff}.inv-light{background:#e2e8f0;color:#334155}
.inv-summary{justify-self:end;color:#475569;font-weight:700}
.inv-table-wrap{overflow:auto}
.inv-table{width:100%;border-collapse:collapse;min-width:900px}
.inv-table th,.inv-table td{border:1px solid #e2e8f0;padding:8px;text-align:center;white-space:nowrap}
.inv-table th{background:#f1f5f9;color:#334155}
.inv-table td.left{text-align:left}.inv-table td.num{text-align:right}
.inv-total td{background:#e2e8f0;font-weight:900;border-top:2px solid #64748b}
.inv-empty{padding:34px!important;color:#94a3b8;text-align:center}
@media(max-width:1000px){.inv-filter{grid-template-columns:80px 1fr 90px 90px}.inv-summary{grid-column:1/-1;justify-self:start}}
</style>
{% endblock %}
{% block content %}
<div class="inv-page">
  <h1>재고 현황</h1>
  <div class="inv-sub">품번별 현재 재고를 저장위치 기준으로 집계합니다. 같은 품번이라도 저장위치가 다르면 별도 행으로 표시됩니다.</div>

  <div class="inv-panel">
    <div class="inv-panel-title">조회 조건</div>
    <div class="inv-filter">
      <strong>품번</strong>
      <input id="invKeyword" placeholder="품번 / 품명 검색" autocomplete="off">
      <button class="inv-btn inv-primary" id="invSearch">조회</button>
      <button class="inv-btn inv-light" id="invReset">초기화</button>
      <div class="inv-summary" id="invSummary">총 0건 · 재고 0</div>
    </div>
  </div>

  <div class="inv-panel">
    <div class="inv-table-wrap">
      <table class="inv-table">
        <thead>
          <tr>
            <th>No.</th><th>품번</th><th>품명</th><th>규격</th><th>단위</th><th>저장위치</th><th>LOT 건수</th><th>현재재고</th>
          </tr>
        </thead>
        <tbody id="invBody"><tr><td colspan="8" class="inv-empty">조회 중입니다...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const fmt=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:3});

async function loadInventoryStatus(){
  const body=$('invBody');
  body.innerHTML='<tr><td colspan="8" class="inv-empty">조회 중입니다...</td></tr>';
  const q=new URLSearchParams();
  const keyword=$('invKeyword').value.trim();
  if(keyword) q.set('q',keyword);
  try{
    const r=await fetch('/api/inventory/status?'+q.toString());
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||'조회 실패');
    const rows=d.items||[];
    $('invSummary').textContent=`총 ${Number(d.total||0).toLocaleString()}건 · 재고 ${fmt(d.stock_qty)}`;
    if(!rows.length){
      body.innerHTML='<tr><td colspan="8" class="inv-empty">현재 재고가 없습니다.</td></tr>';
      return;
    }
    const total=rows.reduce((s,x)=>s+Number(x.stock_qty||0),0);
    body.innerHTML=rows.map((x,i)=>`<tr>
      <td>${i+1}</td>
      <td>${esc(x.part_no)}</td>
      <td class="left">${esc(x.part_name)}</td>
      <td class="left">${esc(x.spec)}</td>
      <td>${esc(x.unit)}</td>
      <td>${esc(x.storage_location||'미지정')}</td>
      <td class="num">${Number(x.lot_count||0).toLocaleString()}</td>
      <td class="num"><strong>${fmt(x.stock_qty)}</strong></td>
    </tr>`).join('')+`<tr class="inv-total"><td colspan="7">전체 합계</td><td class="num">${fmt(total)}</td></tr>`;
  }catch(e){
    body.innerHTML=`<tr><td colspan="8" class="inv-empty" style="color:#b91c1c">${esc(e.message)}</td></tr>`;
  }
}

function resetInventoryStatus(){
  $('invKeyword').value='';
  loadInventoryStatus();
  $('invKeyword').focus();
}

$('invSearch').addEventListener('click',loadInventoryStatus);
$('invReset').addEventListener('click',resetInventoryStatus);
$('invKeyword').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadInventoryStatus();}});
loadInventoryStatus();
</script>
{% endblock %}

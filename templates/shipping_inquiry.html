{% extends "base.html" %}
{% block title %}출고 내역 조회{% endblock %}
{% block extra_head %}
<style>
.page{font-size:13px}.page h1{font-size:21px;margin:0 0 16px}.filters{display:grid;grid-template-columns:150px 150px 180px 180px 180px auto;gap:10px;align-items:end;background:#fff;border:1px solid #dbe3ec;border-radius:6px;padding:14px;margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%;height:34px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px}.btn{border:0;border-radius:4px;padding:8px 15px;font-weight:800;cursor:pointer}.blue{background:#2563eb;color:white}.red{background:#dc2626;color:white}.gray{background:#e2e8f0;color:#334155}.table-wrap{background:#fff;border:1px solid #dbe3ec;border-radius:6px;overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;padding:8px;text-align:center;white-space:nowrap}.tbl th{background:#f8fafc}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#eff6ff}.num{text-align:right!important}.empty{padding:50px!important;color:#94a3b8}.summary{padding:9px 12px;background:#f8fafc;font-weight:700}.detail{margin-top:16px;background:#fff;border:1px solid #dbe3ec;border-radius:6px;padding:14px}.detail h2{font-size:16px;margin-bottom:10px}.meta{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px}.meta span{font-weight:700}.selected{background:#dbeafe!important}.msg{margin:8px 0;min-height:18px}.ok{color:#15803d}.err{color:#b91c1c}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
</style>
{% endblock %}
{% block content %}
<div class="page">
  <h1>출고 내역 조회</h1>
  <div class="filters">
    <div class="field"><label>출고일자 From</label><input id="startDate" type="date"></div>
    <div class="field"><label>출고일자 To</label><input id="endDate" type="date"></div>
    <div class="field"><label>출고번호</label><input id="shipmentNo" placeholder="SH..."></div>
    <div class="field"><label>판매처</label><input id="customerName"></div>
    <div class="field"><label>품번</label><input id="partNo"></div>
    <div><button class="btn blue" onclick="loadRows()">조회</button></div>
  </div>
  <div id="msg" class="msg"></div>
  <div class="table-wrap">
    <table class="tbl">
      <thead><tr><th>출고번호</th><th>출고일자</th><th>수주번호</th><th>판매처</th><th>품번</th><th>출고수량</th><th>박스수</th><th>상태</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="summary" class="summary"></div>
  </div>

  <div id="detail" class="detail" style="display:none">
    <h2>품번별 세부 내역</h2>
    <div id="detailMeta" class="meta"></div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>품번</th><th>품명</th><th>출고수량</th><th>단위</th><th>출고대기LOT</th><th>LOT 수량</th></tr></thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
    <div class="toolbar"><button class="btn red" onclick="deleteSelected()">해당 출고 내역 삭제</button></div>
  </div>
</div>
{% endblock %}
{% block extra_script %}
<script>
let rows=[], selectedId=null;
const $=id=>document.getElementById(id);const n=v=>Number(v||0);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showMsg(t,ok=false){$('msg').textContent=t||'';$('msg').className='msg '+(ok?'ok':'err');}
async function jf(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.detail||'처리 실패');return d;}
function qs(){const p=new URLSearchParams();[['start_date','startDate'],['end_date','endDate'],['shipment_no','shipmentNo'],['customer_name','customerName'],['part_no','partNo']].forEach(([k,id])=>{const v=$(id).value.trim();if(v)p.set(k,v)});return p.toString();}
async function loadRows(){try{const d=await jf('/api/shipping/inquiry?'+qs());rows=d.items||[];selectedId=null;$('detail').style.display='none';render();showMsg('');}catch(e){showMsg(e.message)}}
function render(){if(!rows.length){$('body').innerHTML='<tr><td colspan="8" class="empty">조회할 출고 내역이 없습니다.</td></tr>'; $('summary').textContent='건수: 0';return;}$('body').innerHTML=rows.map(x=>`<tr data-id="${x.id}" onclick="selectRow(${x.id})"><td>${esc(x.shipment_no)}</td><td>${esc(x.shipment_date)}</td><td>${esc(x.order_no)}</td><td>${esc(x.customer_name)}</td><td>${esc((x.part_nos||[]).join(', '))}</td><td class="num">${n(x.total_qty).toLocaleString()}</td><td class="num">${n(x.total_boxes).toLocaleString()}</td><td>${esc(x.status)}</td></tr>`).join('');$('summary').textContent=`건수: ${rows.length}   총 출고수량: ${rows.reduce((s,x)=>s+n(x.total_qty),0).toLocaleString()}`;}
async function selectRow(id){try{selectedId=id;document.querySelectorAll('#body tr').forEach(tr=>tr.classList.toggle('selected',Number(tr.dataset.id)===id));const d=await jf('/api/shipping/inquiry/'+id);$('detail').style.display='block';$('detailMeta').innerHTML=`<span>출고번호: ${esc(d.shipment_no)}</span><span>출고일자: ${esc(d.shipment_date)}</span><span>수주번호: ${esc(d.order_no)}</span><span>판매처: ${esc(d.customer_name)}</span>`;const detailRows=[];(d.items||[]).forEach(item=>{const boxes=item.boxes||[];if(!boxes.length){detailRows.push(`<tr><td>${esc(item.part_no)}</td><td>${esc(item.part_name)}</td><td class="num">${n(item.shipped_qty).toLocaleString()}</td><td>${esc(item.unit)}</td><td></td><td></td></tr>`);}else{boxes.forEach((b,i)=>detailRows.push(`<tr><td>${i===0?esc(item.part_no):''}</td><td>${i===0?esc(item.part_name):''}</td><td class="num">${i===0?n(item.shipped_qty).toLocaleString():''}</td><td>${i===0?esc(item.unit):''}</td><td>${esc(b.waiting_lot_no)}</td><td class="num">${n(b.shipped_qty).toLocaleString()}</td></tr>`));}});$('detailBody').innerHTML=detailRows.join('')||'<tr><td colspan="6" class="empty">세부 내역 없음</td></tr>';showMsg('');}catch(e){showMsg(e.message)}}
async function deleteSelected(){if(!selectedId){showMsg('삭제할 출고 내역을 선택하세요.');return;}const row=rows.find(x=>x.id===selectedId);if(!confirm(`${row?.shipment_no||''} 출고 내역을 삭제하시겠습니까?\n수주 출고수량과 출고대기LOT 사용상태가 복원됩니다.`))return;try{const d=await jf('/api/shipping/inquiry/'+selectedId,{method:'DELETE'});showMsg(d.message,true);await loadRows();}catch(e){showMsg(e.message)}}
document.addEventListener('DOMContentLoaded',()=>{const today=new Date().toISOString().slice(0,10);$('endDate').value=today;loadRows();});
</script>
{% endblock %}

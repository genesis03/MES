<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 출하 관리 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "맑은 고딕", sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            font-size: 20px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
        }
        .form-control:focus {
            border-color: #007bff;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            font-weight: bold;
            margin-top: 14px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-title">출하 바코드 관리 시스템</div>
    <div class="login-subtitle">인증된 사용자만 접근 가능합니다.</div>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" class="form-control" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">로그인</button>
        <div id="errorMsg" class="error-msg"></div>
    </form>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const errorDiv = document.getElementById("errorMsg");
        errorDiv.style.display = "none";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok && data.status === "success") {
                window.location.href = "/shipping";
            } else {
                errorDiv.innerText = data.detail || "로그인 정보가 올바르지 않습니다.";
                errorDiv.style.display = "block";
            }
        } catch (err) {
            errorDiv.innerText = "서버 통신 오류가 발생했습니다.";
            errorDiv.style.display = "block";
        }
    }
</script>
</body>
</html>

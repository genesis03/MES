{% extends "base.html" %}
{% block title %}출고 내역 조회{% endblock %}
{% block extra_head %}
<style>
.page{font-size:13px}.page h1{font-size:21px;margin:0 0 16px}.filters{display:grid;grid-template-columns:150px 150px 180px 220px 180px auto;gap:10px;align-items:end;background:#fff;border:1px solid #dbe3ec;border-radius:6px;padding:14px;margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:34px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;background:#fff}.btn{border:0;border-radius:4px;padding:8px 15px;font-weight:800;cursor:pointer}.btn-sm{padding:5px 10px}.blue{background:#2563eb;color:white}.red{background:#dc2626;color:white}.gray{background:#e2e8f0;color:#334155}.table-wrap{background:#fff;border:1px solid #dbe3ec;border-radius:6px;overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;padding:8px;text-align:center;white-space:nowrap}.tbl th{background:#f8fafc}.tbl tbody tr:hover{background:#eff6ff}.num{text-align:right!important}.left{text-align:left!important}.empty{padding:50px!important;color:#94a3b8}.summary{padding:9px 12px;background:#f8fafc;font-weight:700}.msg{margin:8px 0;min-height:18px}.ok{color:#15803d}.err{color:#b91c1c}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.doc-link{color:#1d4ed8;font-weight:800;text-decoration:underline}.row-check{width:15px;height:15px;cursor:pointer}.flag{display:inline-block;padding:2px 7px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:11px;font-weight:800}.part-picker{position:relative}.picker-box{min-height:34px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 7px}.picker-box:focus-within{border-color:#2563eb;box-shadow:0 0 0 1px #2563eb}.picker-box input{border:0;outline:0;height:26px;min-width:100px;flex:1;padding:0}.chip{display:inline-flex;align-items:center;gap:5px;background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:14px;padding:3px 8px;font-size:12px;font-weight:700}.chip button{border:0;background:transparent;color:#64748b;cursor:pointer;font-size:14px;line-height:1;padding:0}.suggestions{position:absolute;z-index:50;left:0;right:0;top:38px;background:#fff;border:1px solid #cbd5e1;border-radius:4px;box-shadow:0 6px 18px rgba(15,23,42,.12);max-height:260px;overflow:auto;display:none}.suggestion{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:12.5px}.suggestion:hover,.suggestion.active{background:#eff6ff}.suggestion .pn{font-weight:800;color:#1e3a8a}.suggestion .name{margin-left:10px;color:#64748b}
</style>
{% endblock %}
{% block content %}
<div class="page">
  <h1>출고 내역 조회</h1>
  <div class="filters">
    <div class="field"><label>시작일</label><input id="startDate" type="date"></div>
    <div class="field"><label>종료일</label><input id="endDate" type="date"></div>
    <div class="field"><label>판매처</label><select id="customerId"><option value="">전체</option></select></div>
    <div class="field"><label>품번</label><div class="part-picker"><div class="picker-box"><div id="chips" style="display:contents"></div><input id="partSearch" placeholder="품번 / 품명 검색" autocomplete="off"></div><div id="suggestions" class="suggestions"></div></div></div>
    <div class="field"><label>출고번호</label><input id="shipmentNo" placeholder="출고번호"></div>
    <div style="display:flex;gap:6px"><button class="btn blue" onclick="loadRows()">조회</button><button class="btn gray" onclick="resetFilters()">초기화</button></div>
  </div>
  <div id="msg" class="msg"></div>
  <div class="toolbar"><button id="deleteSelectedBtn" class="btn red" onclick="deleteSelected()" disabled>선택삭제 (0)</button></div>
  <div class="table-wrap">
    <table class="tbl">
      <thead><tr><th style="width:46px"></th><th style="width:58px">No.</th><th>출고번호</th><th>일자</th><th>판매처</th><th>품번(요약)</th><th>수량</th><th>박스수</th><th>비고</th><th style="width:80px">인쇄</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="summary" class="summary"></div>
  </div>

</div>
{% endblock %}
{% block extra_script %}
<script>
let rows=[], selectedIds=new Set(), selectedParts=[], candidateRows=[], activeIndex=-1, searchTimer=null;
const $=id=>document.getElementById(id);const n=v=>Number(v||0);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showMsg(t,ok=false){$('msg').textContent=t||'';$('msg').className='msg '+(ok?'ok':'err');}
async function jf(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.detail||'처리 실패');return d;}

async function loadCustomers(){
  const d=await jf('/api/sales/customers');
  $('customerId').innerHTML='<option value="">전체</option>'+(d||[]).map(x=>`<option value="${x.id}">${esc(x.partner_name)}</option>`).join('');
}
function renderChips(){
  $('chips').innerHTML=selectedParts.map((x,i)=>`<span class="chip" title="${esc(x.part_name||'')}">${esc(x.part_no)}<button type="button" data-rm="${i}">×</button></span>`).join('');
  $('chips').querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{selectedParts.splice(Number(b.dataset.rm),1);renderChips();$('partSearch').focus();}));
}
function hideSuggestions(){$('suggestions').style.display='none';$('suggestions').innerHTML='';candidateRows=[];activeIndex=-1;}
function addPart(row){if(!row||!row.item_id)return;if(!selectedParts.some(x=>Number(x.item_id)===Number(row.item_id)))selectedParts.push(row);renderChips();$('partSearch').value='';hideSuggestions();$('partSearch').focus();}
function renderSuggestions(){
  const box=$('suggestions');
  if(!candidateRows.length){box.innerHTML='<div class="suggestion" style="color:#94a3b8">일치하는 품번이 없습니다.</div>';box.style.display='block';return;}
  box.innerHTML=candidateRows.map((x,i)=>`<div class="suggestion${i===activeIndex?' active':''}" data-pi="${i}"><span class="pn">${esc(x.part_no)}</span><span class="name">${esc(x.part_name||'')}</span></div>`).join('');
  box.style.display='block';
  box.querySelectorAll('[data-pi]').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();addPart(candidateRows[Number(el.dataset.pi)]);}));
}
async function searchParts(){
  const q=$('partSearch').value.trim();if(!q){hideSuggestions();return;}
  try{
    const d=await jf('/api/sales/items?q='+encodeURIComponent(q)+'&limit=30');
    candidateRows=(d||[]).filter(x=>!selectedParts.some(s=>Number(s.item_id)===Number(x.item_id)));activeIndex=-1;renderSuggestions();
  }catch(e){$('suggestions').innerHTML=`<div class="suggestion" style="color:#b91c1c">${esc(e.message)}</div>`;$('suggestions').style.display='block';}
}
function qs(){
  const p=new URLSearchParams();
  [['start_date','startDate'],['end_date','endDate'],['shipment_no','shipmentNo'],['customer_id','customerId']].forEach(([k,id])=>{const v=$(id).value.trim();if(v)p.set(k,v)});
  selectedParts.forEach(x=>p.append('item_id',String(x.item_id)));
  return p.toString();
}
function updateSelection(){
  document.querySelectorAll('.row-check').forEach(ch=>ch.checked=selectedIds.has(Number(ch.value)));
  $('deleteSelectedBtn').disabled=selectedIds.size===0;
  $('deleteSelectedBtn').textContent=`선택삭제 (${selectedIds.size})`;
}
function toggleSelected(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);updateSelection();}
function resetFilters(){
  $('startDate').value='';$('endDate').value='';$('customerId').value='';$('shipmentNo').value='';$('partSearch').value='';
  selectedParts=[];candidateRows=[];activeIndex=-1;renderChips();hideSuggestions();loadRows();
}
async function loadRows(){try{const d=await jf('/api/shipping/inquiry?'+qs());rows=d.items||[];selectedIds.clear();render();updateSelection();showMsg('');}catch(e){showMsg(e.message)}}
function render(){
  if(!rows.length){$('body').innerHTML='<tr><td colspan="10" class="empty">조회할 출고 내역이 없습니다.</td></tr>';$('summary').textContent='건수: 0';return;}
  $('body').innerHTML=rows.map((x,i)=>`<tr data-id="${x.id}">
    <td><input type="checkbox" class="row-check" value="${x.id}" onclick="toggleSelected(${x.id})"></td>
    <td>${i+1}</td>
    <td><a class="doc-link" href="/sales/shipping?shipment_id=${encodeURIComponent(x.id)}">${esc(x.shipment_no)}</a></td>
    <td>${esc(x.shipment_date)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.part_summary||'')}</td>
    <td class="num">${n(x.total_qty).toLocaleString()}</td><td class="num">${n(x.total_boxes).toLocaleString()}</td><td class="left">${esc(x.note||'')}${x.shipment_mode==='DIRECT'?' <span class="flag">직출고</span>':(x.fifo_exception?' <span class="flag">FIFO 예외</span>':'')}</td>
    <td>${x.shipment_mode==='DIRECT'?'<button class="btn btn-sm gray" disabled title="샘플/개발 직출고 LOT는 기존 출하 바코드 엔진과 분리되어 있습니다.">-</button>':`<button class="btn btn-sm blue" onclick="printShipment(${x.id})">인쇄</button>`}</td></tr>`).join('');
  $('summary').textContent=`건수: ${rows.length}   총 출고수량: ${rows.reduce((s,x)=>s+n(x.total_qty),0).toLocaleString()}   총 박스수: ${rows.reduce((s,x)=>s+n(x.total_boxes),0).toLocaleString()}`;
}
async function printShipment(id){try{showMsg('인쇄 데이터를 준비하고 있습니다...');await jf('/api/shipping/from-shipments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shipment_ids:[id]})});location.href='/shipping/print';}catch(e){showMsg(e.message)}}
async function deleteSelected(){
  if(!selectedIds.size){showMsg('삭제할 출고 내역을 선택하세요.');return;}
  const selectedRows=rows.filter(x=>selectedIds.has(x.id));
  if(!confirm(`${selectedRows.length}건의 출고 내역을 삭제하시겠습니까?\n연결된 수주의 출고수량과 LOT 사용상태가 복원됩니다.`))return;
  try{for(const row of selectedRows){await jf('/api/shipping/inquiry/'+row.id,{method:'DELETE'});}showMsg(`${selectedRows.length}건의 출고 내역을 삭제했습니다.`,true);await loadRows();}catch(e){showMsg(e.message)}
}
document.addEventListener('DOMContentLoaded',async()=>{
  const today=new Date().toISOString().slice(0,10);$('endDate').value=today;
  $('partSearch').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchParts,180);});
  $('partSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&candidateRows.length){e.preventDefault();activeIndex=Math.min(activeIndex+1,candidateRows.length-1);renderSuggestions();}else if(e.key==='ArrowUp'&&candidateRows.length){e.preventDefault();activeIndex=Math.max(activeIndex-1,0);renderSuggestions();}else if(e.key==='Enter'){e.preventDefault();if(candidateRows.length)addPart(candidateRows[activeIndex>=0?activeIndex:0]);else loadRows();}else if(e.key==='Backspace'&&!$('partSearch').value&&selectedParts.length){selectedParts.pop();renderChips();}else if(e.key==='Escape')hideSuggestions();});
  document.addEventListener('click',e=>{if(!e.target.closest('.part-picker'))hideSuggestions();});
  try{await loadCustomers();await loadRows();}catch(e){showMsg(e.message);}
});
</script>
{% endblock %}

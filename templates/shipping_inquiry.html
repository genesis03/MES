{% extends "base.html" %}
{% block title %}출고 내역 조회{% endblock %}
{% block extra_head %}
<style>
.page{font-size:13px}.page h1{font-size:21px;margin:0 0 16px}.filters{display:grid;grid-template-columns:150px 150px 180px 180px 180px auto;gap:10px;align-items:end;background:#fff;border:1px solid #dbe3ec;border-radius:6px;padding:14px;margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%;height:34px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px}.btn{border:0;border-radius:4px;padding:8px 15px;font-weight:800;cursor:pointer}.btn-sm{padding:5px 10px}.blue{background:#2563eb;color:white}.red{background:#dc2626;color:white}.gray{background:#e2e8f0;color:#334155}.table-wrap{background:#fff;border:1px solid #dbe3ec;border-radius:6px;overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;padding:8px;text-align:center;white-space:nowrap}.tbl th{background:#f8fafc}.tbl tbody tr:hover{background:#eff6ff}.num{text-align:right!important}.left{text-align:left!important}.empty{padding:50px!important;color:#94a3b8}.summary{padding:9px 12px;background:#f8fafc;font-weight:700}.msg{margin:8px 0;min-height:18px}.ok{color:#15803d}.err{color:#b91c1c}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.doc-link{color:#1d4ed8;font-weight:800;text-decoration:underline}.row-check{width:15px;height:15px;cursor:pointer}.flag{display:inline-block;padding:2px 7px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:11px;font-weight:800}
</style>
{% endblock %}
{% block content %}
<div class="page">
  <h1>출고 내역 조회</h1>
  <div class="filters">
    <div class="field"><label>출고일자 From</label><input id="startDate" type="date"></div>
    <div class="field"><label>출고일자 To</label><input id="endDate" type="date"></div>
    <div class="field"><label>출고번호</label><input id="shipmentNo" placeholder="SH..."></div>
    <div class="field"><label>판매처</label><input id="customerName"></div>
    <div class="field"><label>품번</label><input id="partNo"></div>
    <div><button class="btn blue" onclick="loadRows()">조회</button></div>
  </div>
  <div id="msg" class="msg"></div>
  <div class="toolbar"><button id="deleteSelectedBtn" class="btn red" onclick="deleteSelected()" disabled>선택삭제 (0)</button></div>
  <div class="table-wrap">
    <table class="tbl">
      <thead><tr><th style="width:46px"></th><th style="width:58px">No.</th><th>출고번호</th><th>일자</th><th>판매처</th><th>품번(요약)</th><th>수량</th><th>박스수</th><th>비고</th><th style="width:80px">인쇄</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="summary" class="summary"></div>
  </div>

</div>
{% endblock %}
{% block extra_script %}
<script>
let rows=[], selectedIds=new Set();
const $=id=>document.getElementById(id);const n=v=>Number(v||0);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showMsg(t,ok=false){$('msg').textContent=t||'';$('msg').className='msg '+(ok?'ok':'err');}
async function jf(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.detail||'처리 실패');return d;}
function qs(){const p=new URLSearchParams();[['start_date','startDate'],['end_date','endDate'],['shipment_no','shipmentNo'],['customer_name','customerName'],['part_no','partNo']].forEach(([k,id])=>{const v=$(id).value.trim();if(v)p.set(k,v)});return p.toString();}
function updateSelection(){
  document.querySelectorAll('.row-check').forEach(ch=>ch.checked=selectedIds.has(Number(ch.value)));
  $('deleteSelectedBtn').disabled=selectedIds.size===0;
  $('deleteSelectedBtn').textContent=`선택삭제 (${selectedIds.size})`;
}
function toggleSelected(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);updateSelection();}
async function loadRows(){try{const d=await jf('/api/shipping/inquiry?'+qs());rows=d.items||[];selectedIds.clear();render();updateSelection();showMsg('');}catch(e){showMsg(e.message)}}
function render(){
  if(!rows.length){$('body').innerHTML='<tr><td colspan="10" class="empty">조회할 출고 내역이 없습니다.</td></tr>';$('summary').textContent='건수: 0';return;}
  $('body').innerHTML=rows.map((x,i)=>`<tr data-id="${x.id}">
    <td><input type="checkbox" class="row-check" value="${x.id}" onclick="toggleSelected(${x.id})"></td>
    <td>${i+1}</td>
    <td><a class="doc-link" href="/sales/shipping?shipment_id=${encodeURIComponent(x.id)}">${esc(x.shipment_no)}</a></td>
    <td>${esc(x.shipment_date)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.part_summary||'')}</td>
    <td class="num">${n(x.total_qty).toLocaleString()}</td><td class="num">${n(x.total_boxes).toLocaleString()}</td><td class="left">${esc(x.note||'')}${x.shipment_mode==='DIRECT'?' <span class="flag">직출고</span>':(x.fifo_exception?' <span class="flag">FIFO 예외</span>':'')}</td>
    <td>${x.shipment_mode==='DIRECT'?'<button class="btn btn-sm gray" disabled title="샘플/개발 직출고 LOT는 기존 출하 바코드 엔진과 분리되어 있습니다.">-</button>':`<button class="btn btn-sm blue" onclick="printShipment(${x.id})">인쇄</button>`}</td></tr>`).join('');
  $('summary').textContent=`건수: ${rows.length}   총 출고수량: ${rows.reduce((s,x)=>s+n(x.total_qty),0).toLocaleString()}   총 박스수: ${rows.reduce((s,x)=>s+n(x.total_boxes),0).toLocaleString()}`;
}
async function printShipment(id){try{showMsg('인쇄 데이터를 준비하고 있습니다...');await jf('/api/shipping/from-shipments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shipment_ids:[id]})});location.href='/shipping/print';}catch(e){showMsg(e.message)}}
async function deleteSelected(){
  if(!selectedIds.size){showMsg('삭제할 출고 내역을 선택하세요.');return;}
  const selectedRows=rows.filter(x=>selectedIds.has(x.id));
  if(!confirm(`${selectedRows.length}건의 출고 내역을 삭제하시겠습니까?\n연결된 수주의 출고수량과 LOT 사용상태가 복원됩니다.`))return;
  try{
    for(const row of selectedRows){await jf('/api/shipping/inquiry/'+row.id,{method:'DELETE'});}
    showMsg(`${selectedRows.length}건의 출고 내역을 삭제했습니다.`,true);
    await loadRows();
  }catch(e){showMsg(e.message)}
}
document.addEventListener('DOMContentLoaded',()=>{const today=new Date().toISOString().slice(0,10);$('endDate').value=today;loadRows();});
</script>
{% endblock %}

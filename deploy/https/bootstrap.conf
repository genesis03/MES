server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    # Do not serve login over unencrypted HTTP during first certificate issuance.
    location / { return 503; }
}

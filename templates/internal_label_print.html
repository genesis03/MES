{% extends "base.html" %}
{% block title %}내부 LOT 라벨 출력{% endblock %}
{% block extra_head %}
<style>
@page{size:80mm 80mm;margin:0}
.internal-print-toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:14px}
.internal-print-toolbar button{border:0;border-radius:4px;padding:9px 16px;font-weight:800;cursor:pointer}.ip-primary{background:#2563eb;color:#fff}.ip-light{background:#e2e8f0;color:#334155}
.internal-label-page{width:80mm;height:80mm;margin:0 auto 14px;background:#fff;padding:2.5mm;box-sizing:border-box;page-break-after:always}
.internal-label-box{width:75mm;height:75mm;border:2px solid #111;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.internal-label-title{text-align:center;font-size:13pt;font-weight:900;border-bottom:2px solid #111;padding:1.35mm 1mm}
.internal-label-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
.internal-label-table td{border-bottom:1px solid #111;border-right:1px solid #111;padding:.85mm 1mm;vertical-align:middle;height:5.4mm;box-sizing:border-box}
.internal-label-table td:last-child{border-right:0}
.internal-label-table col.c1{width:16%}
.internal-label-table col.c2{width:38%}
.internal-label-table col.c3{width:16%}
.internal-label-table col.c4{width:30%}
.internal-label-table .k{font-weight:900;text-align:center;white-space:nowrap}
.internal-label-table .storage-k{font-size:7.2pt;letter-spacing:-.2px;padding-left:.45mm;padding-right:.45mm}
.internal-label-table .storage-row td{height:5.4mm;padding-top:.85mm;padding-bottom:.85mm}
.internal-label-table .v{font-weight:800}
.internal-label-table .wide{font-size:8.5pt;overflow:hidden}
.internal-label-table .half-k{font-weight:900;text-align:center;white-space:nowrap}
.internal-label-table .half-v{font-weight:800;overflow:hidden}
.internal-extra{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid #111}
.internal-extra div{border-right:1px solid #111;text-align:center;padding:.75mm .45mm;font-size:8pt;display:flex;align-items:center;justify-content:center}
.internal-extra div:last-child{border-right:0}
.internal-extra .extra-label{font-weight:800;white-space:nowrap}
.internal-extra .extra-value{font-size:9pt;font-weight:900}
.internal-barcode{margin-top:auto;padding:1.1mm 2.2mm .35mm;text-align:center;min-height:25mm;display:flex;flex-direction:column;justify-content:flex-end}
.internal-barcode .barcode-svg{width:100%;height:22mm;display:block;shape-rendering:crispEdges;margin:0 auto}
.internal-lot-text{font-family:Consolas,monospace;font-weight:900;font-size:8pt;margin-top:.35mm;letter-spacing:.2px;line-height:1}
.internal-company{text-align:center;font-size:8.5pt;font-weight:900;margin-top:2mm;padding:.35mm 0 .65mm;line-height:1}
.internal-label-box.production-label .internal-label-title{padding:.9mm 1mm}
.internal-label-box.production-label .internal-company{margin-top:0}
@media print{.sidebar,.internal-print-toolbar{display:none!important}.main-content{padding:0!important}.internal-label-page{margin:0!important}.internal-label-box{box-shadow:none!important}}
</style>
{% endblock %}
{% block content %}
<div class="internal-print-toolbar no-print"><button class="ip-light" onclick="window.close()">닫기</button><button class="ip-primary" onclick="window.print()">라벨 인쇄</button></div>
<div id="internalLabels"></div>
{% endblock %}
{% block extra_script %}
<script src="/static/js/barcode_engine.js"></script>
<script>
const INTERNAL_LABELS={{ labels|tojson }};
const AUTO_PRINT={{ 'true' if auto_print else 'false' }};
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const fmt=v=>{const n=Number(v||0);return Number.isInteger(n)?n.toLocaleString('ko-KR'):n.toLocaleString('ko-KR',{maximumFractionDigits:3});};
function render(){
  const root=document.getElementById('internalLabels');
  root.innerHTML=INTERNAL_LABELS.map(row=>{
    const extra=(row.extras||[]).length?`<div class="internal-extra">${row.extras.map(x=>`<div class="extra-label">${esc(x.label)}</div><div class="extra-value">${fmt(x.value)}</div>`).join('')}</div>`:'';
    const productionClass=(row.operator||row.shift)?' production-label':'';
    return `<section class="internal-label-page"><div class="internal-label-box${productionClass}">
      <div class="internal-label-title">${esc(row.title)}</div>
      <table class="internal-label-table">
        <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
        <tbody>
        <tr><td class="k">품번</td><td class="v" colspan="3">${esc(row.part_no)}</td></tr>
        <tr><td class="k">품명</td><td class="v wide" colspan="3">${esc(row.part_name)}</td></tr>
        <tr><td class="half-k">LOT</td><td class="half-v">${esc(row.lot_no)}</td><td class="half-k">수량</td><td class="half-v">${fmt(row.qty)} ${esc(row.unit)}</td></tr>
        <tr><td class="half-k">${esc(row.date_label||'기준일')}</td><td class="half-v">${esc(row.date)}</td><td class="half-k">공정</td><td class="half-v">${esc(row.process)}</td></tr>
        ${(row.operator||row.shift)?`<tr><td class="half-k">작업자</td><td class="half-v">${esc(row.operator)}</td><td class="half-k">주/야</td><td class="half-v">${esc(row.shift)}</td></tr>`:''}
        <tr class="storage-row"><td class="k storage-k">저장위치</td><td class="v wide" colspan="3">${esc(row.storage)}</td></tr>
      </tbody></table>${extra}
      <div class="internal-barcode">${Code128Engine.createSVG(String(row.lot_no||''))}<div class="internal-lot-text">${esc(row.lot_no)}</div></div>
      <div class="internal-company">(주)유니코어텍</div>
    </div></section>`;
  }).join('');
}
render();
if(AUTO_PRINT){window.addEventListener('load',()=>setTimeout(()=>window.print(),250),{once:true});}
</script>
{% endblock %}

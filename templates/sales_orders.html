{% extends "base.html" %}
{% block title %}수주 입력{% endblock %}
{% block extra_head %}
<style>
.card{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px}.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.btn-primary{background:#2563eb;color:#fff}.btn-danger{background:#dc2626;color:#fff}.btn-light{background:#e2e8f0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:8px;font-size:12px;text-align:center}th{background:#f1f5f9}.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
{% endblock %}
{% block content %}
<h2 style="margin-bottom:16px">수주 입력</h2>
<div class="card">
  <div class="grid">
    <div class="field"><label>수주일자</label><input type="date" id="orderDate"></div>
    <div class="field"><label>납기예정일</label><input type="date" id="deliveryDueDate"></div>
    <div class="field"><label>고객사</label><select id="customerId"><option value="">선택</option></select></div>
    <div class="field"><label>담당자</label><input id="managerName" maxlength="50"></div>
  </div>
  <div class="field" style="margin-top:12px"><label>비고</label><textarea id="note" rows="2"></textarea></div>
</div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>수주 품목</strong><button class="btn btn-light" id="addRowBtn">+ 품목 추가</button></div>
  <table>
    <thead><tr><th style="width:34%">품번</th><th>품명</th><th style="width:13%">수주수량</th><th style="width:12%">단위</th><th style="width:15%">납기일</th><th style="width:70px">삭제</th></tr></thead>
    <tbody id="itemBody"></tbody>
  </table>
  <div class="toolbar"><button class="btn btn-primary" id="saveBtn">수주 저장</button></div>
</div>
<script src="/static/sales_orders.js"></script>
{% endblock %}

# Opt-in replacement for docker-compose.oracle.yml; do not combine the two files.
services:
  mes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mes
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/manual_labels.db}
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/data/documents}
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips=*"]
    expose:
      - "8080"
    volumes:
      - ./data:/data
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - mes
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/https/nginx:/etc/nginx/conf.d:ro
      - ./data/https/challenges:/var/www/certbot:ro
      - ./data/https/letsencrypt:/etc/letsencrypt:ro
  certbot:
    image: certbot/certbot:latest
    profiles: ["certificate"]
    volumes:
      - ./data/https/challenges:/var/www/certbot
      - ./data/https/letsencrypt:/etc/letsencrypt

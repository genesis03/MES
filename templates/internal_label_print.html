{% extends "base.html" %}
{% block title %}내부 LOT 라벨 출력{% endblock %}
{% block extra_head %}
<style>
@page{size:80mm 80mm;margin:0}
.internal-print-toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:14px}
.internal-print-toolbar button{border:0;border-radius:4px;padding:9px 16px;font-weight:800;cursor:pointer}.ip-primary{background:#2563eb;color:#fff}.ip-light{background:#e2e8f0;color:#334155}
.internal-label-page{width:80mm;height:80mm;margin:0 auto 14px;background:#fff;padding:1.5mm;box-sizing:border-box;page-break-after:always}
.internal-label-box{width:77mm;height:77mm;border:1.5px solid #111;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.internal-label-title{text-align:center;font-size:12pt;font-weight:900;border-bottom:1.5px solid #111;padding:.8mm .8mm;line-height:1.15}
.internal-label-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.6pt}
.internal-label-table col.c-key{width:16%}.internal-label-table col.c-main{width:40%}.internal-label-table col.c-subkey{width:12%}.internal-label-table col.c-sub{width:32%}
.internal-label-table td{border-bottom:1px solid #111;border-right:1px solid #111;padding:.75mm .8mm;vertical-align:middle;height:5.6mm;box-sizing:border-box;line-height:1.1}
.internal-label-table td:last-child{border-right:0}
.internal-label-table .k,.internal-label-table .half-k{font-weight:900;text-align:center;white-space:nowrap}
.internal-label-table .v,.internal-label-table .half-v{font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:clip}
.internal-label-table .wide{font-size:8.1pt}
.internal-label-table .lot-value{font-family:Consolas,monospace;font-size:7.7pt;letter-spacing:-.15px}
.internal-label-table .qty-value{font-size:8.2pt}
.internal-label-table .date-value,.internal-label-table .process-value{font-size:8pt}
.internal-extra{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #111}
.internal-extra div{border-right:1px solid #111;text-align:center;padding:.45mm .4mm;font-size:7.5pt;line-height:1.05}
.internal-extra div:last-child{border-right:0}
.internal-extra b{display:block;font-size:8.4pt;margin-top:.15mm}
.internal-barcode{margin-top:3mm;padding:0 1.7mm;text-align:center;display:flex;flex-direction:column;justify-content:flex-start}
.internal-barcode .barcode-svg{width:100%;height:20.5mm;display:block;shape-rendering:crispEdges;margin:0 auto}
.internal-lot-text{font-family:Consolas,monospace;font-weight:900;font-size:7.5pt;margin-top:.25mm;letter-spacing:.05px;line-height:1}
.internal-company{text-align:center;font-size:8pt;font-weight:900;margin-top:1.8mm;padding:0 0 .45mm;line-height:1}
@media print{.sidebar,.internal-print-toolbar{display:none!important}.main-content{padding:0!important}.internal-label-page{margin:0!important}.internal-label-box{box-shadow:none!important}}
</style>
{% endblock %}
{% block content %}
<div class="internal-print-toolbar no-print"><button class="ip-light" onclick="window.close()">닫기</button><button class="ip-primary" onclick="window.print()">라벨 인쇄</button></div>
<div id="internalLabels"></div>
{% endblock %}
{% block extra_script %}
<script src="/static/js/barcode_engine.js"></script>
<script>
const INTERNAL_LABELS={{ labels|tojson }};
const AUTO_PRINT={{ 'true' if auto_print else 'false' }};
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const fmt=v=>{const n=Number(v||0);return Number.isInteger(n)?n.toLocaleString('ko-KR'):n.toLocaleString('ko-KR',{maximumFractionDigits:3});};
function render(){
  const root=document.getElementById('internalLabels');
  root.innerHTML=INTERNAL_LABELS.map(row=>{
    const extra=(row.extras||[]).length?`<div class="internal-extra">${row.extras.map(x=>`<div>${esc(x.label)}<b>${fmt(x.value)}</b></div>`).join('')}</div>`:'';
    return `<section class="internal-label-page"><div class="internal-label-box">
      <div class="internal-label-title">${esc(row.title)}</div>
      <table class="internal-label-table">
        <colgroup><col class="c-key"><col class="c-main"><col class="c-subkey"><col class="c-sub"></colgroup>
        <tbody>
        <tr><td class="k">품번</td><td class="v" colspan="3">${esc(row.part_no)}</td></tr>
        <tr><td class="k">품명</td><td class="v wide" colspan="3">${esc(row.part_name)}</td></tr>
        <tr><td class="half-k">LOT</td><td class="half-v lot-value">${esc(row.lot_no)}</td><td class="half-k">수량</td><td class="half-v qty-value">${fmt(row.qty)} ${esc(row.unit)}</td></tr>
        <tr><td class="half-k">기준일</td><td class="half-v date-value">${esc(row.date)}</td><td class="half-k">공정</td><td class="half-v process-value">${esc(row.process)}</td></tr>
        <tr><td class="k">저장위치</td><td class="v wide" colspan="3">${esc(row.storage)}</td></tr>
      </tbody></table>${extra}
      <div class="internal-barcode">${Code128Engine.createSVG(String(row.lot_no||''))}<div class="internal-lot-text">${esc(row.lot_no)}</div></div>
      <div class="internal-company">(주)유니코어텍</div>
    </div></section>`;
  }).join('');
}
render();
if(AUTO_PRINT){window.addEventListener('load',()=>setTimeout(()=>window.print(),250),{once:true});}
</script>
{% endblock %}
